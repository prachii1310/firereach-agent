<!DOCTYPE html>
<html>
<head>
<title>FireReach AI</title>
</head>

<body>

<h2>FireReach Autonomous Outreach</h2>

ICP<br>
<input id="icp"><br><br>

Company<br>
<input id="company"><br><br>

Email<br>
<input id="email"><br><br>

<button onclick="runAgent()">Run Agent</button>

<pre id="output"></pre>

<script>

async function runAgent(){

const icp=document.getElementById("icp").value
const company=document.getElementById("company").value
const email=document.getElementById("email").value

const response=await fetch(
`http://127.0.0.1:8000/run-agent?icp=${icp}&company=${company}&email=${email}`,
{method:"POST"}
)

const data=await response.json()

document.getElementById("output").innerText=
JSON.stringify(data,null,2)

}

</script>

</body>
</html>
